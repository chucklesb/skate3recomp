# RE-7: guest call counts at a busy spot (Downtown's Tresoutta Plaza, the
# crowd), standing and then pushing off; same steps as profile_plaza.
# Needs the callcount build: run_scenario.py windows <this> --config callcount
#
# Check: tools/re/leaves.py rank <run>   (hot functions grouped by class)
name = "callcount_plaza"
timeout_s = 900
boot = "demo"
start_spot = "Z_DT_Tresoutta"

[cvars]
skate3_guest_fps_cap = 30.0
skate3_guest_fps_cap_auto = false

[[step]]
do = "wait"
gameplay = true
timeout_s = 400

[[step]]
do = "wait"
frames = 150

[[step]]
do = "callcount"
op = "reset"

[[step]]
do = "wait"
frames = 450

[[step]]
do = "input"
buttons = "a"
frames = 8

[[step]]
do = "wait"
frames = 300

[[step]]
do = "input"
buttons = "a"
frames = 8

[[step]]
do = "wait"
frames = 300

[[step]]
do = "callcount"
op = "dump"
