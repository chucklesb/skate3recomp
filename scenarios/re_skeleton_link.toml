# RE-5: check the link between the player skater's UpdateBoneTransforms
# parts and the persistent MeshContexts the renderer draws (part k = the
# entity's current-LOD instance k; docs/re/characters.md). Plays the forearm
# reel with the probe logging every 5th UBT call ("re-ubt:" lines in
# log.txt); every line should report all parts "matched one persistent ctx
# by mesh", each part k against instance k.0.
name = "re_skeleton_link"
timeout_s = 1200
boot = "demo"

[cvars]
skate3_demo_path_signed_in = true
skate3_guest_fps_cap = 30.0
skate3_guest_fps_cap_auto = false
skate3_native_render_scene_char_sync = true
skate3_harness_re_ubt = 5

[[step]]
do = "wait"
gameplay = true
timeout_s = 400

[[step]]
do = "wait"
frames = 120

[[step]]
do = "play_reel"
reel = "a9bbe6156adca014"
from = "marker"
every_frames = 3
tag = "rf"
