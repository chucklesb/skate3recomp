# Complete a career challenge without playing it (career step, complete =
# "name"; docs/re/career.md). With pay = true it goes through the game's own
# completion (sub_827CDB10, as a challenge's end does): the challenge's
# Owned reward (and its Killed reward with level = "killed") is paid, its
# level recorded, unlocks gated on it fire, and the results screens follow.
# The results step walks them (Continue on New Teammate), waits for the
# results end (FE 24 is a closing cutscene) and the save that follows (the
# indicator bottom right; it watches SKATER.P), so the change is kept.
# Without pay, only the level is recorded (sub_82C1D878), nothing is shown
# and nothing is saved.
# Challenge names: docs/re/attrib_names.tsv (challenge_global_data / _local_data)
# (tools/re/attrib.py lookup film_; "0x<hash>" works too). A level is
# only ever upgraded; an already completed challenge pays nothing again.
name = "career_complete_challenge"
timeout_s = 600
boot = "demo"

[cvars]
skate3_demo_path_signed_in = true

[[step]]
do = "wait"
gameplay = true
timeout_s = 400

[[step]]
do = "wait"
frames = 150   # let the location title pass

[[step]]
do = "career"
complete = "street_dwtn_01"
level = "killed"
pay = true

[[step]]
do = "results"   # through the results and the save that follows
timeout_s = 300

[[step]]
do = "state"

[[step]]
do = "screenshot"
tag = "saved"
