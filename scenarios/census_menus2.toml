# Pass census on the menu screens not covered by census_menus.toml: the team
# screen's Import Skater card and My Replays (Create tab > skate.Reel > My
# Replays, FE [0,56,59]). Never saves. 5 s per screen, 30 fps cap.
# Summarise: census_report.py <run>; per-interval rows in events.jsonl.
name = "census_menus2"
timeout_s = 500
boot = "demo"
state_every_frames = 10

[cvars]
skate3_demo_path_signed_in = true
skate3_guest_fps_cap = 30.0
skate3_guest_fps_cap_auto = false
native_render_pass_census = true
native_render_pass_census_detail = true

[[step]]
do = "wait"
gameplay = true
timeout_s = 300

