# KI-124: the user's reel played in motion from its marker with the
# character debug view 3 (sun-facing-but-shadowed in red), a shot every 2
# frames. Held stills settle the pose smoothing; this shows the moving
# frames. Count the red with a per-frame pixel count of the upper body.
name = "ki124_motion_debug"
timeout_s = 900
boot = "demo"

[cvars]
skate3_demo_path_signed_in = true
skate3_guest_fps_cap = 30.0
skate3_guest_fps_cap_auto = false
skate3_native_render_scene_char_debug = 3

[[step]]
do = "wait"
gameplay = true
timeout_s = 400

[[step]]
do = "wait"
frames = 30

[[step]]
do = "play_reel"
reel = "88a86b704bcf2d71"
from = "marker"
every_frames = 2
