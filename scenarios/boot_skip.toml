# The intro skip (docs/re/boot.md): a normal boot, pressing a different
# button on each screen. A picks the language (the game's own input), X
# (held 1.5 s, into the movie) skips only the Skate 3 logo, LB skips the Black Box movie; the title must then
# stay up (no press carried into it). Read the per-screen times with
# tools/harness/boot_timing.py RUN; compare with scenarios/boot_timing.toml.
name = "boot_skip"
timeout_s = 90
boot = "none"
state_every_frames = 10

[cvars]
skate3_demo_path_signed_in = true
skate3_demo_path_probe = true
skate3_guest_fps_cap_auto = false
skate3_intro_movie_skip = true

[[step]]
do = "wait"
ms = 2500

[[step]]
do = "screenshot"
tag = "language"

[[step]]
do = "input"
buttons = "a"
frames = 3

[[step]]
do = "wait"
ms = 1800

[[step]]
do = "screenshot"
tag = "logo"

[[step]]
do = "input"
buttons = "x"
frames = 45   # held into the movie: must skip only the logo

[[step]]
do = "wait"
ms = 1500

[[step]]
do = "screenshot"
tag = "movie"

[[step]]
do = "input"
buttons = "lb"
frames = 3

[[step]]
do = "wait"
ms = 2500

[[step]]
do = "screenshot"
tag = "title"

[[step]]
do = "wait"
ms = 3000

[[step]]
do = "screenshot"
tag = "title_still"
