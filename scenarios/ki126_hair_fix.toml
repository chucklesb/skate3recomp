# KI-126 fix check: reel 511e079e9279419f (clip 8) held at 22.5 and 23.5 s
# with the hair depth pass off (the old see-through blue veil) and on,
# native, then both moments on the emulated renderer for reference.
name = "ki126_hair_fix"
timeout_s = 1500
boot = "demo"

[cvars]
skate3_demo_path_signed_in = true
skate3_guest_fps_cap = 30.0
skate3_guest_fps_cap_auto = false

[[step]]
do = "wait"
gameplay = true
timeout_s = 400

[[step]]
do = "wait"
frames = 30

[[step]]
do = "play_reel"
clip = 8
from = "marker"
stills = [22.50, 23.50]
settle_frames = 30
stills_variants = [
  { tag = "off", set = { skate3_native_render_scene_hair_depth = false } },
  { tag = "on", set = { skate3_native_render_scene_hair_depth = true } },
]
timeout_s = 600

[[step]]
do = "play_reel"
clip = 8
from = "marker"
stills = [22.50, 23.50]
settle_frames = 30
stills_renderers = ["native", "emulated"]
timeout_s = 600
