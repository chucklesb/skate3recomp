# Window check (Windows): run it with --display headless (starts hidden and
# muted) or windowed (starts minimized, audio on). The window is shown and
# restored (audio on) for a few seconds, then hidden (muted) again. log.txt
# has "window shown (audio on)" and "window hidden (audio muted)"; the
# screenshots are the same in every state.
#
#   tools/harness/run_scenario.py windows scenarios/window_smoke.toml --display windowed

name = "window_smoke"
timeout_s = 180
boot = "demo"

[[step]]
do = "wait"
frames = 120

[[step]]
do = "screenshot"
tag = "hidden"

[[step]]
do = "window"
show = true

[[step]]
do = "wait"
frames = 180

[[step]]
do = "screenshot"
tag = "shown"

[[step]]
do = "window"
show = false

[[step]]
do = "wait"
frames = 60

[[step]]
do = "screenshot"
tag = "hidden_again"
