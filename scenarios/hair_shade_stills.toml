# Hair colour in sun vs shade, frame-exact (2026-11-13): the user's
# pink-haired skater (device reel b363c5f2700483f3, Tresoutta Plaza arch).
# 22.80 s = full sun, 24.90 s = under the arch. Native shots showed the hair
# pink in sun and near-black in shade while the shirt kept its green.
# Shots: reel25_t22.80_native / _emulated, reel25_t24.90_native / _emulated.
name = "hair_shade_stills"
timeout_s = 900
boot = "demo"

[cvars]
skate3_demo_path_signed_in = true
skate3_guest_fps_cap = 30.0
skate3_guest_fps_cap_auto = false

[[step]]
do = "wait"
gameplay = true
timeout_s = 400

[[step]]
do = "wait"
frames = 30

[[step]]
do = "play_reel"
reel = "b363c5f2700483f3"
from = "marker"
stills = [22.80, 24.90]
settle_frames = 30
stills_renderers = ["native", "emulated"]
timeout_s = 600
