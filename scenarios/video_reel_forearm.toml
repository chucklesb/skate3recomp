# Video of the forearm reel (repro_reel_forearm.toml) from its first marker:
# every rendered frame to video/rf/, the reel clock stepping exactly 1/30 s per
# frame, so the readback never drops frames (it only slows the run).
#
# Make the MP4:  tools/harness/reel_video.py <run> out.mp4 --label "..."
# Before/after the KI-117 follow-up fix: append, after `--`,
#   --skate3_native_render_scene_char_spread_floor=0.2   (the old limit)
# char_sync stays on, so char_sync_report.py <run> --reel checks the same run.
name = "video_reel_forearm"
timeout_s = 1200
boot = "demo"

[cvars]
skate3_demo_path_signed_in = true
skate3_guest_fps_cap = 30.0
skate3_guest_fps_cap_auto = false
skate3_native_render_scene_char_sync = true

[[step]]
do = "wait"
gameplay = true
timeout_s = 400

[[step]]
do = "wait"
frames = 120

[[step]]
do = "play_reel"
reel = "a9bbe6156adca014"
from = "marker"
video = true
step_fps = 30
tag = "rf"
