# Canal water probe: the Downtown canal by the Villas (Plaza of Solitude), a
# water.alpha surface (wateralpha_defaultPS). Native and emulated shots of the
# same view, for KI-122 (the orange reflections) and the exact wateralpha
# port (shadows on the water, the murky body colour, blue sky glints).
name = "water_probe"
timeout_s = 600
boot = "demo"

[cvars]
skate3_guest_fps_cap = 30.0
skate3_guest_fps_cap_auto = false

[[step]]
do = "wait"
gameplay = true
timeout_s = 400

[[step]]
do = "wait"
frames = 90

[[step]]
do = "mark"
text = "water_probe: teleporting to the canal"

[[step]]
do = "teleport"
pos = [-176.189, 49.557, -150.73]
yaw = -75

[[step]]
do = "wait"
frames = 90

[[step]]
do = "state"
tag = "canal"

[[step]]
do = "screenshot"
tag = "canal_nat"

[[step]]
do = "renderer"
renderer = "emulated"
frames = 30

[[step]]
do = "screenshot"
tag = "canal_emu"

[[step]]
do = "renderer"
renderer = "native"
