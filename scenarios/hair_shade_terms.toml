# Hair lighting vs the emulated renderer (2026-11-13; see
# hair_shade_stills.toml). Same two frames (22.80 s sun, 24.90 s shade under
# the Tresoutta Plaza arch, device reel b363c5f2700483f3), once per
# skate3_native_render_scene_hair_debug setting, plus the emulated renderer.
# First round (before the fix): only "no highlight + plain N.L" (3) matched
# emulated. The ucode showed why: cac_hair lights the strands with a
# normal-mapped normal and feeds the RAW N.L into the ramps. Bits: 1 = no
# strand highlight, 2 = plain N.L key, 4 = no world shadow, 8 = view-fresnel
# highlight, 16 = no normal map, 32 = old clamped N.L; 48 = the old port.
name = "hair_shade_terms"
timeout_s = 1200
boot = "demo"

[cvars]
skate3_demo_path_signed_in = true
skate3_guest_fps_cap = 30.0
skate3_guest_fps_cap_auto = false

[[step]]
do = "wait"
gameplay = true
timeout_s = 400

[[step]]
do = "wait"
frames = 30

[[step]]
do = "play_reel"
reel = "b363c5f2700483f3"
from = "marker"
stills = [22.80, 24.90]
settle_frames = 30
stills_variants = [
  { tag = "fixed", set = { skate3_native_render_scene_hair_debug = 0 } },
  { tag = "old", set = { skate3_native_render_scene_hair_debug = 48 } },
  { tag = "nonormalmap", set = { skate3_native_render_scene_hair_debug = 16 } },
  { tag = "clampedndl", set = { skate3_native_render_scene_hair_debug = 32 } },
  { tag = "emulated", set = { skate3_native_render_scene_hair_debug = 0, skate3_native_render_scene = false } },
  { tag = "end", set = { skate3_native_render_scene = true } },
]
timeout_s = 900
