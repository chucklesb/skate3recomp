# The game's subsystems, for the coverage report (tools/re/coverage.py,
# docs/re/coverage.md; docs/plan.md, P1).
#
# A function belongs to the first subsystem whose `names` regex matches its
# name (the hand map, then Skate 3's bindings, then the Skate 2 transfer).
# Unnamed functions are inferred from their neighbours: when the nearest
# named functions before and after it are in the same subsystem, so is it
# (object files are laid out contiguously). Order matters: specific first.

[frontend]
title = "Frontend and HUD: APT movies, FE states, text"
page = "ui.md"
names = ['^Sk8::FE\b', '^Sk8::FE::', '^FrontEnd', '^Apt', '^Sk8::HUD', '^FontFace', '^Font', '^rw::movie', 'Localiz', 'GetLocaleText']

[boot]
title = "Boot flow and the app tick"
page = "boot.md"
names = ['^Sk8::Flow', '^Sk8AppMan', 'StateBootFlow']

[characters]
title = "Characters: skeleton, skinning, create-a-character, animation"
page = "characters.md"
names = ['^Character', '^Sk8::CAC', '^AnimCmdSys', 'UpdateBoneTransforms', 'PackAndMultiply', '^Sk8::Render::cModelInstance', '^Sk8::Anim', '^Anim']

[livingworld]
